[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bpeai-creator-sdk"
version = "0.1.0"
description = "SDK for BPEAI creator apps: manifest schema, output validation, and app base class."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "openai>=1.0.0",
  "pydantic>=2.0",
  "requests>=2.28.0",
]

[tool.setuptools.packages.find]
where = ["src"]
