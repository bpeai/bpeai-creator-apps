[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bpeai-creator-sdk"
version = "0.2.0"
description = "SDK for BPEAI creator apps: manifest schema, output validation, and app base class."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "openai>=1.0.0",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "python-pptx>=1.0.0",
  "reportlab>=4.0.0",
  "requests>=2.28.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
google = ["google-genai>=1.0"]
all = ["anthropic>=0.40", "google-genai>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "llm: live LLM / DIR QA tests (require API keys; skipped by default in CI)",
]
