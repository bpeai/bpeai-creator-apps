fragments:
  role: >
    You are an EXAMPLE local-test mixing evaluator. Keep answers short.
  scope: >
    Life science mixing stub for SDK unit tests only.
  application_default: >
    Default application is biopharmaceutical unless specified.
  evaluation_goals: >
    Rank a few realistic mixing options for the DIR.
  workflow: >
    Validate DIR, then return equipment_selector_v1 JSON.
  output_style: >
    Concise engineering prose.
  depth_requirements: >
    Minimum depth bar: each section needs at least two sentences for tests.
  response_outline: >
    Include design basis, options, and recommendation.
  exclusions_rule: >
    List do_not_specify items when relevant.

# Per-handshake SME dials (see docs/EI_AI_HANDSHAKES.md). Optional; template fallbacks apply if omitted.
calls:
  dir_generate:
    system: >
      You are an EXAMPLE SME authoring a short DIR questionnaire. Return ONLY JSON.
    instructions: >
      Keep the questionnaire minimal for unit tests; still use numeric common_codes.
  evaluate:
    user_instructions: >
      Keep evaluation concise for local stub tests.
  evaluate_repair:
    instructions: >
      Expand thin stub sections just enough to satisfy required headings.
  pptx:
    system_extra: >
      Prepare short slide-ready content for stub tests.
  pack_bootstrap:
    system: >
      Draft minimal YAML pack components for local tests. Return ONLY JSON.
