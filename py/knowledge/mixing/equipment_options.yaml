# Allowed / preferred mixing technology options for LLM validation and prompting.

options:
  - id: top_entry_low_shear_hydrofoil
    name: Top-entry low-shear axial hydrofoil agitator
    tags: [in_tank, low_shear, axial]
    typical_fit: [media_preparation, buffer_blend]
    manufacturers:
      - SPX FLOW Lightnin (A310/A510 hydrofoil family)
      - EKATO
      - Alfa Laval
      - DCI
      - WMProcess
      - Philadelphia Mixing Solutions
      - Lee Industries
      - AGI/Holloway
      - Bioengineering AG

  - id: top_entry_pitched_blade
    name: Top-entry pitched-blade turbine / wide-blade PBT
    tags: [in_tank, transitional_shear]
    typical_fit: [media_preparation, powder_dissolve, buffer_blend]
    manufacturers:
      - SPX FLOW Lightnin
      - EKATO
      - Alfa Laval
      - DCI
      - WMProcess
      - Mixmor
      - Philadelphia Mixing Solutions

  - id: aseptic_magnetic_bottom
    name: Aseptic magnetic bottom mixer
    tags: [in_tank, magnetic, aseptic, low_shear]
    typical_fit: [aseptic_hold, sterile_blend, low_heel]
    manufacturers:
      - Alfa Laval LeviMag UltraPure
      - Steridose
      - Metenova
      - ZETA

  - id: single_use_mixer_bag
    name: Single-use magnetic mixer / bag system
    tags: [single_use, closed]
    typical_fit: [media_preparation, buffer_preparation, single_use]
    manufacturers:
      - Sartorius
      - Thermo Fisher (HyPerforma)
      - MilliporeSigma (Mobius)

  - id: powder_induction_loop
    name: Inline powder-induction recirculation loop
    tags: [powder, induction, loop, add_on]
    typical_fit: [powder_dissolve, difficult_wetting, dust_control]
    manufacturers:
      - Admix Fastfeed
      - Silverson Flashmix/Flashblend
      - Ystral Conti-TDS
      - IKA
      - Quadro/Ytron
      - GEA

  - id: rotor_stator_loop
    name: Inline high-shear rotor-stator mixer
    tags: [inline, high_shear, add_on]
    typical_fit: [difficult_wetting, deagglomeration, special_case]
    manufacturers:
      - Silverson
      - Admix
      - IKA
      - Ystral
      - Quadro/Ytron
      - Bematek

  - id: jet_eductor_loop
    name: Jet / eductor loop mixer
    tags: [loop, eductor, limited]
    typical_fit: [retrofit, large_volume]
    manufacturers:
      - Various sanitary eductor / jet-mix suppliers

  - id: inline_static_mixer
    name: Inline static mixer
    tags: [inline, continuous, limited_primary]
    typical_fit: [liquid_blend, concentrate_addition]
    manufacturers:
      - Various sanitary static-mixer suppliers

  - id: low_shear_resin_suspension
    name: Low-shear resin suspension agitator
    tags: [in_tank, low_shear, slurry]
    typical_fit: [chromatography_resin_slurry]
    manufacturers:
      - EKATO
      - SPX FLOW Lightnin
      - ZETA
      - Philadelphia Mixing Solutions

do_not_specify_defaults:
  - High-speed dispersers as primary basis for readily soluble media
  - Rushton turbines as primary media-prep basis
  - Static mixer-only designs for batch powder charging duties
  - Side-entry agitators when top-entry sanitary batch prep is the DIR basis

