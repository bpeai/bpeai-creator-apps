# Pack identity — equipment system: mixing (platform seed)
pack_id: mixing
equipment_system: mixing
version: "0.2.0"
label: Life science mixing systems
description: >
  SME pack for DIR questionnaires and option catalogs used by equipment_evaluator
  apps (e.g. agitator / impeller / inline mixer selection). Platform-owned seed;
  creators clone into a private pack for their own apps.

# Creator-alignment metadata (platform seed has null owner; expertise is system-level).
expertise_keys:
  - mixing
  - agitation
  - powder_induction
alignment_category: equipment_technology
alignment_subcategory: mixing_agitation

# Coverage: default life_science; creators may narrow on clone / app bind.
coverage_scope:
  default: life_science
  industries:
    - Biopharmaceuticals
    - Pharmaceutical small molecule
    - Industrial biotechnology
    - Food

# Industries this pack is intended to serve (hub facet language).
industries:
  - Biopharmaceuticals
  - Pharmaceutical small molecule
  - Industrial biotechnology
  - Food

# Default equipment-system variant when unspecified.
default_variant: general_mixing

# Default preparation / scenario keys when system_name is ambiguous.
default_scenario: media_preparation

# Map free-text system_name fragments → scenario ids in dir_requirements.yaml
scenario_aliases:
  media_preparation:
    - media
    - buffer
    - media preparation
    - buffer preparation
  chromatography_resin_slurry:
    - resin
    - chromatography
    - slurry
    - chromatography resin slurry

# Optional free-text → equipment_system_variant
variant_aliases:
  general_mixing:
    - mixing
    - agitator
    - impeller
    - vessel
  inline_mixer:
    - inline
    - eductor
    - powder induction
  single_use_mixer:
    - single-use
    - single use
    - bag mixer

# Optional bridge to shared bpeai_taxonomy preparations (ids).
taxonomy_preparation_ids:
  - media
  - cell_culture_media
  - buffer_solution
  - chromatography_resin_slurry
  - fermentation_media

prompt_hooks:
  system_role: senior_process_mixing_engineer
  emphasize:
    - Do not assume the answer must be an in-tank agitator
    - Consider inline, jet, eductor, single-use, and slurry-capable approaches
    - Prefer options listed in equipment_options.yaml when recommending
