# Validation policy for the mixing pack.

dir_code:
  # Hard-fail invalid DIR before calling the LLM.
  mode: hard
  require_all_segments: true
  min_index: 1
  # On failure, return dir phase payload + suggested_correction from common_codes[0].

application:
  # Prefer shared bpeai_taxonomy applications when available.
  mode: soft  # soft = warn / normalize; hard = reject unknown
  normalize: lowercase_strip
  # Optional aliases mapped into taxonomy-ish labels
  aliases:
    biopharma: biopharmaceutical
    "small molecule": pharmaceutical
    pharma: pharmaceutical

equipment_option_name:
  # When LLM returns mixing_options[].name or selected_model:
  mode: soft
  # soft: keep result but flag unknown names in source_basis / warnings
  # hard: re-prompt or reject
  match: fuzzy_against_options  # exact | fuzzy_against_options

selected_model:
  mode: soft
  prefer_from: equipment_options

fit_enum:
  allowed: [best, strong, conditional, limited, add-on, special-case]
  mode: hard

equipment_system_field:
  # Output schema field equipment_system must match pack.
  mode: hard
  must_equal: mixing

repair:
  # If structured JSON fails schema or hard enums, one repair LLM pass is allowed.
  max_attempts: 1
