# DRAFT — initial version pending SME / platform approval.
# DIR questionnaires by scenario for vent / sterile barrier filtration.
# DIR code = hyphen-separated 1-based option indexes, one per requirement in order.
# Example sterile_tank_vent code: 2-1-2-3-1-1

scenarios:
  sterile_tank_vent:
    label: Sterile tank vent / breather
    common_codes:
      - code: "2-1-2-3-1-1"
        caption: "250–2,000 L stainless buffer/hold tank; breathing + CIP/SIP vent; hydrophobic 0.2 µm capsule."
      - code: "3-1-3-4-2-2"
        caption: "2,000–10,000 L WFI/process vessel; continuous sterile barrier with heated housing and cartridge."
      - code: "2-3-2-3-1-3"
        caption: "250–2,000 L single-use hold; sterile vent filter assembly for closed processing."
    requirements:
      - index: 1
        label: Vessel working volume
        options:
          - { index: 1, text: "< 250 L" }
          - { index: 2, text: "250–2,000 L" }
          - { index: 3, text: "2,000–10,000 L" }
          - { index: 4, text: "10,000–30,000 L" }
          - { index: 5, text: "> 30,000 L" }
      - index: 2
        label: Vessel format
        options:
          - { index: 1, text: "Stainless fixed CIP/SIP vessel" }
          - { index: 2, text: "Stainless portable vessel" }
          - { index: 3, text: "Single-use bag / hold system" }
          - { index: 4, text: "Hybrid stainless + single-use fluid path" }
      - index: 3
        label: Gas / vent duty
        options:
          - { index: 1, text: "Breathing only (fill/empty equalization)" }
          - { index: 2, text: "Breathing + CIP/SIP venting" }
          - { index: 3, text: "Continuous sterile barrier during processing" }
          - { index: 4, text: "High instantaneous exhaust (fast fill/empty or CIP blowdown)" }
          - { index: 5, text: "Gas blanketing / overlay with controlled exhaust" }
      - index: 4
        label: Sterility / barrier requirement
        options:
          - { index: 1, text: "Bioburden-controlled vent (non-sterile claim)" }
          - { index: 2, text: "Low-bioburden closed processing" }
          - { index: 3, text: "Sterile barrier (0.2 µm hydrophobic, integrity-testable)" }
          - { index: 4, text: "Validated sterile hold / aseptic processing support" }
          - { index: 5, text: "Dual redundant sterile vent train" }
      - index: 5
        label: Filter format preference
        options:
          - { index: 1, text: "Disposable capsule / capsule assembly" }
          - { index: 2, text: "Cartridge in stainless sanitary housing" }
          - { index: 3, text: "Single-use integrated vent filter set" }
          - { index: 4, text: "No strong preference — optimize for DIR" }
      - index: 6
        label: Thermal / condensate challenge
        options:
          - { index: 1, text: "Ambient breathing; limited condensate" }
          - { index: 2, text: "SIP / hot vapor exposure; condensate risk" }
          - { index: 3, text: "Heated housing or steam-jacketed preferred" }
          - { index: 4, text: "Cold room / outdoor exposure with freeze risk" }
          - { index: 5, text: "Not applicable / unknown" }

  bioreactor_vent:
    label: Bioreactor / fermenter vent
    common_codes:
      - code: "2-1-2-3-1"
        caption: "Pilot bioreactor; sterile exhaust with hydrophobic sterile vent; capsule format."
      - code: "3-1-3-4-2"
        caption: "Production bioreactor; continuous sterile exhaust; cartridge housing with integrity testing."
    requirements:
      - index: 1
        label: Working volume class
        options:
          - { index: 1, text: "Bench / < 50 L" }
          - { index: 2, text: "Pilot 50–2,000 L" }
          - { index: 3, text: "Production > 2,000 L" }
      - index: 2
        label: Vessel format
        options:
          - { index: 1, text: "Stainless CIP/SIP bioreactor" }
          - { index: 2, text: "Single-use bioreactor" }
          - { index: 3, text: "Stainless with single-use exhaust path" }
      - index: 3
        label: Exhaust / vent duty
        options:
          - { index: 1, text: "Low gas exchange / overlay primarily" }
          - { index: 2, text: "Continuous sterile exhaust during culture" }
          - { index: 3, text: "High aeration / high exhaust flow" }
          - { index: 4, text: "SIP + sterile exhaust train" }
      - index: 4
        label: Sterility / barrier requirement
        options:
          - { index: 1, text: "Bioburden-controlled exhaust" }
          - { index: 2, text: "Sterile barrier (integrity-testable)" }
          - { index: 3, text: "Validated aseptic / closed culture support" }
          - { index: 4, text: "Dual redundant sterile exhaust" }
      - index: 5
        label: Filter format preference
        options:
          - { index: 1, text: "Disposable capsule" }
          - { index: 2, text: "Cartridge in sanitary housing" }
          - { index: 3, text: "Single-use exhaust filter assembly" }
          - { index: 4, text: "No strong preference — optimize for DIR" }
