# DRAFT — initial version pending SME / platform approval.
# Validation policy for the filtration (vent filter) pack.

dir_code:
  mode: hard
  require_all_segments: true
  min_index: 1

application:
  mode: soft
  normalize: lowercase_strip
  aliases:
    biopharma: biopharmaceutical
    "small molecule": pharmaceutical
    pharma: pharmaceutical

equipment_option_name:
  mode: soft
  match: fuzzy_against_options

selected_model:
  mode: soft
  prefer_from: equipment_options

fit_enum:
  allowed: [best, strong, conditional, limited, add-on, special-case]
  mode: hard

equipment_system_field:
  mode: hard
  must_equal: filtration

repair:
  max_attempts: 1
