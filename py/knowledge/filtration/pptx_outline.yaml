# DRAFT — initial version pending SME / platform approval.
# Standard 7-slide deck — vent / sterile barrier filtration.

slide_count: 7
title_prefix: "Vent Filter Selection"

slides:
  - index: 1
    id: title
    title: "{system_name}"
    subtitle: "Vent filtration technology evaluation and preliminary basis of design"
    bullets_from: [dir_summary, recommended_basis]
  - index: 2
    id: design_basis
    title: "Design basis from DIR code"
    content_from: [dir_summary, design_basis, decoded_dir]
  - index: 3
    id: objectives
    title: "Filtration objectives, constraints and failure modes"
    content_from: [objectives, failure_modes]
  - index: 4
    id: options
    title: "Realistic vent-filtration options"
    content_from: [mixing_options]
  - index: 5
    id: matrix
    title: "Option evaluation matrix"
    content_from: [evaluation_matrix]
  - index: 6
    id: recommendation
    title: "Recommended basis and alternate option"
    content_from: [recommended_basis, alternate_basis, rationale]
  - index: 7
    id: specs
    title: "Preliminary specification points / vendors / references"
    content_from: [preliminary_specs, manufacturers, do_not_specify, source_basis]

style:
  slide_width_in: 13.333
  slide_height_in: 7.5
  fonts:
    display: Aptos Display
    body: Aptos
  colors:
    navy: "17324D"
    teal: "00A398"
    blue: "2962A3"
    gray: "6B7280"
    body: "1F2937"
    white: "FFFFFF"
    card_fill: "F3F6F9"
  notes:
    - Use reference PPTX visual style (chips, cards, footers, project-team summary tone).
    - LLM drafts slide_pack JSON; renderer applies fixed reference layout/colors/fonts with auto-fit.
    - Align slide content with the written evaluation (datasheet_markdown).
    - Public-repo references/*.pptx are style stubs only; SMEs replace private decks via
      `python py/tools/manage_pptx_reference.py --pack filtration list|replace`.

reference_decks: []
