# Allowed / preferred vent-filtration technology options for LLM validation and prompting.

options:
  - id: hydrophobic_ptfe_capsule_vent
    name: Hydrophobic PTFE sterile vent filter capsule (0.2 µm)
    tags: [vent, hydrophobic, capsule, sterile_barrier]
    typical_fit: [sterile_tank_vent, breathing, cip_sip_vent]
    manufacturers:
      - Pall (Emflon / similar hydrophobic vent capsules)
      - Sartorius (hydrophobic midisart / vent capsules)
      - Merck Millipore (hydrophobic Aervent / Durapore families where applicable)
      - Meissner
      - Parker domnick hunter (PROCESS FILTER lines)

  - id: hydrophobic_pvdf_capsule_vent
    name: Hydrophobic PVDF sterile vent filter capsule
    tags: [vent, hydrophobic, capsule]
    typical_fit: [sterile_tank_vent, single_use]
    manufacturers:
      - Pall
      - Sartorius
      - Merck Millipore
      - Meissner

  - id: cartridge_ss_housing_vent
    name: Hydrophobic sterile vent cartridge in stainless sanitary housing
    tags: [vent, cartridge, stainless_housing, sip]
    typical_fit: [sterile_tank_vent, bioreactor_vent, large_vessel]
    manufacturers:
      - Pall
      - Sartorius
      - Merck Millipore
      - Eaton / Begerow (sanitary housings where applicable)
      - Donaldson (process sterile air / vent where applicable)

  - id: heated_vent_housing
    name: Heated / steam-jacketed sterile vent filter housing
    tags: [vent, heated, condensate_control, sip]
    typical_fit: [sip, condensate_risk, outdoor_or_cold]
    manufacturers:
      - Pall (heated housing options)
      - Sartorius
      - Custom sanitary skid fabricators with OEM filter elements

  - id: dual_redundant_vent_train
    name: Dual-redundant sterile vent filter train
    tags: [vent, redundant, validated_sterile]
    typical_fit: [validated_sterile_hold, aseptic, high_criticality]
    manufacturers:
      - Pall
      - Sartorius
      - Merck Millipore
      - System integrators using dual validated hydrophobic elements

  - id: single_use_vent_assembly
    name: Single-use sterile vent filter assembly
    tags: [vent, single_use, closed]
    typical_fit: [single_use, bioreactor_vent, closed_processing]
    manufacturers:
      - Sartorius
      - Thermo Fisher (single-use assemblies)
      - Merck Millipore (Mobius / single-use vent sets)
      - Pall (single-use systems)

  - id: depth_prefilter_plus_sterile_vent
    name: Depth prefilter + hydrophobic sterile vent final
    tags: [vent, prefilter, add_on]
    typical_fit: [high_aerosol, dirty_exhaust, special_case]
    manufacturers:
      - Pall
      - Sartorius
      - Merck Millipore
      - Donaldson

do_not_specify_defaults:
  - Hydrophilic liquid sterilizing filters as the primary tank vent barrier
  - Non-integrity-testable consumer-grade breathers for sterile barrier claims
  - Unheated vent housings as sole mitigation when DIR indicates heavy SIP condensate risk
  - Depth-only filtration without a validated hydrophobic sterile final for sterile-hold DIR

manufacturers_examples:
  - Pall
  - Sartorius
  - Merck Millipore
  - Meissner
  - Parker domnick hunter
  - Donaldson
  - Thermo Fisher (single-use assemblies)
